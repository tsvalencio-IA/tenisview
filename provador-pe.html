<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Corre 4 • Provador Mobile por Mira</title>
<meta name="theme-color" content="#020814" />
<style>
:root{--bg:#020814;--glass:rgba(5,12,22,.76);--glass2:rgba(8,18,32,.92);--line:rgba(255,255,255,.14);--text:#f5f8ff;--muted:#b8c5d8;--gold:#f6c84f;--green:#18c77d;--blue:#3f9bff;--red:#ff4868}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overscroll-behavior:none;touch-action:none}button,input{font:inherit}#app{position:fixed;inset:0;overflow:hidden;background:#000}#video,#ar,#guide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#video{z-index:1;background:#000}#video.mirror{transform:scaleX(-1)}#ar{z-index:3;pointer-events:none}#guide{z-index:4;pointer-events:none}.vignette{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% 52%,transparent 0 55%,rgba(0,0,0,.18) 100%)}
.top{position:absolute;z-index:20;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}.card{pointer-events:auto;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);border-radius:17px;box-shadow:0 12px 34px rgba(0,0,0,.28)}.title{padding:9px 11px;max-width:54vw}.title h1{margin:0 0 3px;font-size:14px;line-height:1.05;font-weight:950}.title p{margin:0;color:var(--muted);font-size:11px;line-height:1.2;font-weight:650}.topBtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}.btn{border:0;min-height:36px;padding:0 11px;border-radius:13px;background:#17283f;color:#fff;font-weight:950;font-size:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}.btn.gold{background:linear-gradient(#ffe56f,#d1a017);color:#171100}.btn.green{background:linear-gradient(#1bd98a,#0a9256)}.btn.blue{background:linear-gradient(#4cabff,#1769c6)}.btn.red{background:#36131d;color:#ffd7df}.btn.active{outline:2px solid var(--gold)}a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.aim{position:absolute;z-index:5;left:50%;top:49%;width:78vw;height:34vh;max-width:470px;max-height:350px;transform:translate(-50%,-50%) rotate(var(--rot,0deg));border:3px dashed rgba(246,200,79,.9);border-radius:60% 60% 52% 52%/68% 68% 44% 44%;box-shadow:0 0 0 9999px rgba(0,0,0,.06),0 0 45px rgba(246,200,79,.18);pointer-events:none;transition:border-color .15s ease}.aim.locked{border-color:rgba(24,199,125,.98);box-shadow:0 0 0 9999px rgba(0,0,0,.02),0 0 50px rgba(24,199,125,.32)}.aim::before{content:"PÉ DENTRO DA MIRA";position:absolute;left:50%;top:-40px;transform:translateX(-50%);white-space:nowrap;background:rgba(2,8,20,.78);border:1px solid rgba(255,255,255,.14);padding:8px 12px;border-radius:999px;color:#ffeba7;font-size:11px;font-weight:950;letter-spacing:.04em}.aim.off{display:none}.cross{position:absolute;z-index:6;left:50%;top:49%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:rgba(255,255,255,.8);border-radius:99px}.cross:before{left:10px;top:0;width:2px;height:22px}.cross:after{left:0;top:10px;width:22px;height:2px}.cross.off{display:none}
.bottom{position:absolute;z-index:30;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));display:grid;gap:7px;pointer-events:none}.mainbar{pointer-events:auto;display:grid;grid-template-columns:1.1fr 1fr .75fr .75fr;gap:6px;padding:7px;background:rgba(2,8,20,.80);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(16px)}.mainbar .btn{min-height:40px;font-size:12px;padding:0 6px}.strip{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;background:rgba(2,8,20,.70);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:6px;backdrop-filter:blur(12px);scrollbar-width:none}.strip::-webkit-scrollbar{display:none}.strip .btn{min-height:32px;white-space:nowrap;background:rgba(255,255,255,.10)}.drawer{pointer-events:auto;display:none;grid-template-columns:1fr 1fr;gap:7px;max-height:42vh;overflow:auto;padding:8px;background:rgba(2,8,20,.88);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(16px)}.drawer.open{display:grid}.slider{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:9px}.slider label{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;font-size:10px;font-weight:950;letter-spacing:.06em;text-transform:uppercase;color:#cbd8ea}.slider input{width:100%;accent-color:var(--gold)}.statusLine{pointer-events:none;justify-self:center;max-width:92vw;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:7px 11px;color:#fff;font-size:11px;font-weight:900;text-shadow:0 2px 10px #000;text-align:center}.diag{position:absolute;z-index:40;left:8px;right:8px;top:82px;max-height:42vh;overflow:auto;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:9px;font:11px/1.45 ui-monospace,Consolas,monospace;color:#cfe0f6;white-space:pre-wrap;display:none}.diag.show{display:block}.loader{position:absolute;z-index:60;inset:0;background:radial-gradient(circle,#12305c,#020814 65%);display:grid;place-items:center;text-align:center;padding:18px}.loader.hide{display:none}.loaderCard{max-width:460px;border:1px solid rgba(255,255,255,.14);border-radius:24px;background:rgba(255,255,255,.08);padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.45)}.loaderCard h2{margin:0 0 8px;font-size:28px}.loaderCard p{margin:0 0 12px;color:#d6e5fa;font-size:14px;line-height:1.45}.toast{position:absolute;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%);max-width:88vw;display:none;background:rgba(2,8,20,.92);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:14px 16px;text-align:center;font-weight:850;box-shadow:0 20px 70px rgba(0,0,0,.5)}.toast.show{display:block}
@media(max-width:480px){.title{max-width:45vw;padding:8px 9px}.title h1{font-size:12px}.title p{font-size:10px}.topBtns .btn{min-height:31px;font-size:10px;padding:0 8px}.aim{top:47%;width:84vw;height:32vh}.aim::before{top:-34px;font-size:10px;padding:6px 9px}.cross{top:47%}.mainbar{grid-template-columns:1fr 1fr 44px 44px}.mainbar .btn{min-height:36px;font-size:10px}.strip .btn{min-height:30px;font-size:10px;padding:0 10px}.drawer{grid-template-columns:1fr 1fr}.slider{padding:8px}.slider label{font-size:9px}.statusLine{font-size:10px;padding:6px 9px}.loaderCard h2{font-size:24px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<div id="app">
  <video id="video" autoplay playsinline muted></video>
  <div class="vignette"></div>
  <canvas id="ar"></canvas>
  <canvas id="guide"></canvas>
  <div class="aim" id="aim"></div><div class="cross" id="cross"></div>

  <div class="top">
    <div class="card title"><h1>Corre 4 • Provador</h1><p id="stateText">Câmera ainda não iniciada</p></div>
    <div class="topBtns"><a class="btn" href="index.html">Início</a><button class="btn" id="diagBtn">Debug</button><button class="btn gold" id="resetBtn">Reset</button></div>
  </div>

  <div class="bottom">
    <div class="statusLine" id="statusLine">Modo seguro: a mira calibra mesmo sem a IA achar o pé.</div>
    <div class="mainbar">
      <button class="btn green" id="openBtn">Abrir câmera</button>
      <button class="btn gold" id="calibrateBtn">Calibrar pela mira</button>
      <button class="btn blue" id="photoBtn">📸</button>
      <button class="btn" id="settingsBtn">⚙</button>
    </div>
    <div class="strip">
      <button class="btn active" id="modeAimBtn">Modo mira</button>
      <button class="btn" id="modeAiBtn">Seguir IA</button>
      <button class="btn" id="mirrorBtn">Espelhar</button>
      <button class="btn active" id="aimBtn">Mira</button>
      <button class="btn" id="camBtn">Trocar câmera</button>
      <button class="btn" id="freezeBtn">Congelar</button>
      <button class="btn" id="leftBtn">↶</button>
      <button class="btn" id="rightBtn">↷</button>
    </div>
    <div class="drawer" id="drawer">
      <div class="slider"><label>Tamanho mira <span id="vAim">100%</span></label><input id="aimSize" type="range" min="65" max="145" value="100"></div>
      <div class="slider"><label>Cobertura <span id="vCover">118%</span></label><input id="cover" type="range" min="90" max="165" value="118"></div>
      <div class="slider"><label>Altura <span id="vY">0</span></label><input id="yFine" type="range" min="-180" max="180" value="0"></div>
      <div class="slider"><label>Lateral <span id="vX">0</span></label><input id="xFine" type="range" min="-180" max="180" value="0"></div>
      <div class="slider"><label>Rotação <span id="vRot">0°</span></label><input id="rotFine" type="range" min="-120" max="120" value="0"></div>
      <div class="slider"><label>Opacidade <span id="vOp">96%</span></label><input id="opacity" type="range" min="40" max="100" value="96"></div>
      <div class="slider"><label>Suavização IA <span id="vSmooth">72%</span></label><input id="smooth" type="range" min="20" max="94" value="72"></div>
      <div class="slider"><label>Pitch visual <span id="vPitch">-8°</span></label><input id="pitch" type="range" min="-70" max="70" value="-8"></div>
    </div>
  </div>
  <pre class="diag" id="diag"></pre>
  <div class="loader" id="loader"><div class="loaderCard"><h2>Provador no Pé</h2><p>Esta versão calibra pela mira mesmo quando a IA não encontra o pé. Primeiro abra a câmera, coloque o pé dentro da mira e toque em <b>Calibrar pela mira</b>.</p><button class="btn gold" id="loaderOpenBtn">Abrir câmera agora</button></div></div>
  <div class="toast" id="toast"></div>
</div>
<script type="module">
let PoseLandmarker=null, FilesetResolver=null;
try{const mod=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');PoseLandmarker=mod.PoseLandmarker;FilesetResolver=mod.FilesetResolver;}catch(e){console.warn('MediaPipe indisponível',e)}
const $=id=>document.getElementById(id);const video=$('video'),ar=$('ar'),guide=$('guide'),g=guide.getContext('2d');
const stateText=$('stateText'),statusLine=$('statusLine'),diag=$('diag'),loader=$('loader'),aim=$('aim'),cross=$('cross'),toast=$('toast');
let cameraFacing='environment',stream=null,mirror=false,showAim=true,frozen=false,mode='aim',pose=null,poseReady=false,lastVideoTime=-1,lastFoot=null,lastTransform=null,shoeReady=false,calibrated=false;
let renderer,scene,camera,shoeRoot,modelLen=1;
function v(id){return +$(id).value}function rad(d){return d*Math.PI/180}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function lerp(a,b,t){return a+(b-a)*t}function angle(a,b){return Math.atan2(b.y-a.y,b.x-a.x)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function msg(s){statusLine.textContent=s}function setState(s){stateText.textContent=s}function showToast(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1700)}
function resize(){const W=innerWidth,H=innerHeight;ar.width=W;ar.height=H;guide.width=W;guide.height=H;if(renderer){renderer.setSize(W,H,false);camera.left=-W/2;camera.right=W/2;camera.top=H/2;camera.bottom=-H/2;camera.updateProjectionMatrix()}updateAimCss()}window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,300));
function updateLabels(){$('vAim').textContent=v('aimSize')+'%';$('vCover').textContent=v('cover')+'%';$('vY').textContent=v('yFine');$('vX').textContent=v('xFine');$('vRot').textContent=v('rotFine')+'°';$('vOp').textContent=v('opacity')+'%';$('vSmooth').textContent=v('smooth')+'%';$('vPitch').textContent=v('pitch')+'°'}
function updateAimCss(){const s=v('aimSize')/100;aim.style.width=(78*s)+'vw';aim.style.height=(34*s)+'vh';aim.style.setProperty('--rot',v('rotFine')+'deg')}
function initThree(){renderer=new THREE.WebGLRenderer({canvas:ar,alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;scene=new THREE.Scene();camera=new THREE.OrthographicCamera(-innerWidth/2,innerWidth/2,innerHeight/2,-innerHeight/2,-1000,1000);camera.position.z=100;scene.add(new THREE.HemisphereLight(0xffffff,0x335577,1.8));let l=new THREE.DirectionalLight(0xffffff,1.6);l.position.set(0,0,200);scene.add(l);shoeRoot=new THREE.Group();scene.add(shoeRoot);loadModel();resize();renderLoop()}
function fallbackShoe(){const group=new THREE.Group();const red=new THREE.MeshStandardMaterial({color:0xd21123,roughness:.75,transparent:true,opacity:.96});const dark=new THREE.MeshStandardMaterial({color:0x50040c,roughness:.9,transparent:true,opacity:.96});const white=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.96});const sole=new THREE.Mesh(new THREE.BoxGeometry(300,44,84,12,2,3),dark);sole.position.y=-28;group.add(sole);const upper=new THREE.Mesh(new THREE.BoxGeometry(260,76,66,14,4,4),red);upper.position.set(-5,8,0);group.add(upper);const toe=new THREE.Mesh(new THREE.SphereGeometry(46,28,16),red);toe.scale.set(1.25,.72,.8);toe.position.set(132,6,0);group.add(toe);const heel=new THREE.Mesh(new THREE.SphereGeometry(48,28,16),red);heel.scale.set(.85,1,.85);heel.position.set(-132,9,0);group.add(heel);for(let i=0;i<6;i++){let lace=new THREE.Mesh(new THREE.BoxGeometry(72,7,5),dark);lace.position.set(-55+i*23,50,28);lace.rotation.z=(i%2?.22:-.22);group.add(lace)}const logo=textPlane('CORRE');logo.position.set(-30,28,45);group.add(logo);return group}
function textPlane(t){const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.font='900 82px Arial';x.fillStyle='white';x.fillText(t,20,88);const tex=new THREE.CanvasTexture(c);return new THREE.Mesh(new THREE.PlaneGeometry(145,36),new THREE.MeshBasicMaterial({map:tex,transparent:true}))}
function loadModel(){new THREE.GLTFLoader().load('models/corre4.glb',gltf=>{shoeRoot.clear();shoeRoot.add(gltf.scene);prepModel();shoeReady=true;},undefined,()=>{shoeRoot.clear();shoeRoot.add(fallbackShoe());prepModel();shoeReady=true;})}
function prepModel(){let box=new THREE.Box3().setFromObject(shoeRoot);let size=new THREE.Vector3(),center=new THREE.Vector3();box.getSize(size);box.getCenter(center);shoeRoot.children[0].position.sub(center);modelLen=Math.max(size.x,size.y,size.z,1);shoeRoot.visible=false;shoeRoot.traverse(o=>{if(o.isMesh){o.frustumCulled=false;if(o.material){o.material.transparent=true;o.material.opacity=v('opacity')/100}}})}
function renderLoop(){requestAnimationFrame(renderLoop);if(renderer)renderer.render(scene,camera)}
async function openCamera(){try{loader.classList.remove('hide');setState('Abrindo câmera...');if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:cameraFacing},width:{ideal:1280},height:{ideal:720}}})}catch(e){stream=await navigator.mediaDevices.getUserMedia({audio:false,video:true})}video.srcObject=stream;await video.play();loader.classList.add('hide');setState('Câmera pronta');msg('Coloque o pé dentro da mira e toque em Calibrar pela mira.');if(PoseLandmarker&&!pose)loadPose();requestAnimationFrame(loop)}catch(e){setState('Erro na câmera');msg('Erro: '+(e.message||e));}}
async function loadPose(){try{const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:.22,minPosePresenceConfidence:.22,minTrackingConfidence:.22});poseReady=true}catch(e){try{const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task',delegate:'CPU'},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:.22,minPosePresenceConfidence:.22,minTrackingConfidence:.22});poseReady=true}catch(err){poseReady=false;console.warn(err)}}}
function videoMap(lm){const W=innerWidth,H=innerHeight,vw=video.videoWidth||W,vh=video.videoHeight||H,sc=Math.max(W/vw,H/vh),dw=vw*sc,dh=vh*sc,ox=(W-dw)/2,oy=(H-dh)/2;let x=ox+lm.x*dw,y=oy+lm.y*dh;if(mirror)x=W-x;return{x,y,v:lm.visibility??1,z:lm.z||0}}
function detectFoot(){if(!poseReady||!pose||video.currentTime===lastVideoTime)return null;lastVideoTime=video.currentTime;let res;try{res=pose.detectForVideo(video,performance.now())}catch(e){return null}let l=res.landmarks&&res.landmarks[0];if(!l)return null;function one(side){let i=side==='left'?{ankle:27,heel:29,toe:31}:{ankle:28,heel:30,toe:32};let ankle=videoMap(l[i.ankle]),heel=videoMap(l[i.heel]),toe=videoMap(l[i.toe]);let len=dist(heel,toe),vis=(ankle.v+heel.v+toe.v)/3;return{side,ankle,heel,toe,len,vis,center:{x:(heel.x+toe.x)/2,y:(heel.y+toe.y)/2},ang:angle(heel,toe),score:len+vis*180}}let L=one('left'),R=one('right');let f=L.score>R.score?L:R;if(f.len<35||f.vis<.05)return null;return f}
function targetFromAim(){const W=innerWidth,H=innerHeight;let aimW=Math.min(W*.78*(v('aimSize')/100),470);let aimH=Math.min(H*.34*(v('aimSize')/100),350);let lengthPx=Math.max(aimW,aimH*.95)*(v('cover')/100);return{x:W/2 + v('xFine'),y:H*.49 + v('yFine'),len:lengthPx,ang:rad(v('rotFine'))}}
function targetFromFoot(f){return{x:f.center.x+v('xFine'),y:f.center.y+v('yFine'),len:f.len*(v('cover')/100),ang:f.ang+rad(v('rotFine'))}}
function applyTarget(t,instant=false){if(!shoeReady)return;let W=innerWidth,H=innerHeight,scale=t.len/modelLen;let target={x:t.x-W/2,y:H/2-t.y,scale,rz:-t.ang,rx:rad(v('pitch')),ry:0};let smooth=(v('smooth')/100);let a=instant?1:(1-smooth);if(!lastTransform)lastTransform=target;lastTransform.x=lerp(lastTransform.x,target.x,a);lastTransform.y=lerp(lastTransform.y,target.y,a);lastTransform.scale=lerp(lastTransform.scale,target.scale,a);let d=Math.atan2(Math.sin(target.rz-lastTransform.rz),Math.cos(target.rz-lastTransform.rz));lastTransform.rz+=d*a;lastTransform.rx=lerp(lastTransform.rx,target.rx,a);shoeRoot.visible=true;shoeRoot.position.set(lastTransform.x,lastTransform.y,0);shoeRoot.scale.setScalar(lastTransform.scale);shoeRoot.rotation.set(lastTransform.rx,0,lastTransform.rz);shoeRoot.traverse(o=>{if(o.isMesh&&o.material){o.material.opacity=v('opacity')/100;o.material.transparent=true}});calibrated=true;aim.classList.add('locked')}
function drawFoot(f){g.clearRect(0,0,guide.width,guide.height);if(!f)return;g.lineWidth=4;g.strokeStyle='rgba(24,199,125,.95)';g.fillStyle='white';g.beginPath();g.moveTo(f.heel.x,f.heel.y);g.lineTo(f.toe.x,f.toe.y);g.moveTo(f.heel.x,f.heel.y);g.lineTo(f.ankle.x,f.ankle.y);g.stroke();[['PONTA',f.toe],['CALCANHAR',f.heel],['TORNOZELO',f.ankle]].forEach(([txt,p])=>{g.beginPath();g.arc(p.x,p.y,7,0,Math.PI*2);g.fill();g.font='800 11px Arial';g.fillText(txt,p.x+9,p.y-8)})}
function loop(){requestAnimationFrame(loop);if(!video.srcObject||frozen)return;let f=detectFoot();if(f){lastFoot=f;drawFoot(f);if(mode==='ai'&&calibrated){applyTarget(targetFromFoot(f),false);msg('IA seguindo o pé. Se escorregar, volte ao Modo mira.')}}else{drawFoot(null);if(mode==='ai')msg('IA procurando pé. Mostre pé + tornozelo; modo mira continua disponível.')}diag.textContent=JSON.stringify({mode,calibrated,poseReady,foot:f&&{side:f.side,len:Math.round(f.len),vis:f.vis.toFixed(2)},aim:targetFromAim()},null,2)}
function calibrateAim(){mode='aim';$('modeAimBtn').classList.add('active');$('modeAiBtn').classList.remove('active');applyTarget(targetFromAim(),true);setState('Calibrado pela mira');msg('Tênis travado na mira. Ajuste Tamanho mira / Cobertura / Rotação se precisar.');showToast('Calibrado pela mira')}
function reset(){calibrated=false;lastTransform=null;shoeRoot.visible=false;aim.classList.remove('locked');setState('Resetado');msg('Coloque o pé na mira e calibre novamente.')}
function photo(){let c=document.createElement('canvas');c.width=innerWidth;c.height=innerHeight;let x=c.getContext('2d');x.drawImage(video,0,0,innerWidth,innerHeight);x.drawImage(ar,0,0);x.drawImage(guide,0,0);let a=document.createElement('a');a.download='corre4-provador.png';a.href=c.toDataURL('image/png');a.click()}
$('openBtn').onclick=openCamera;$('loaderOpenBtn').onclick=openCamera;$('calibrateBtn').onclick=calibrateAim;$('resetBtn').onclick=reset;$('photoBtn').onclick=photo;$('settingsBtn').onclick=()=>$('drawer').classList.toggle('open');$('diagBtn').onclick=()=>diag.classList.toggle('show');$('modeAimBtn').onclick=()=>{mode='aim';$('modeAimBtn').classList.add('active');$('modeAiBtn').classList.remove('active');if(calibrated)applyTarget(targetFromAim(),true);msg('Modo mira: funciona sem a IA achar o pé.')};$('modeAiBtn').onclick=()=>{mode='ai';$('modeAiBtn').classList.add('active');$('modeAimBtn').classList.remove('active');msg(poseReady?'Modo IA: tentando seguir pé + tornozelo.':'IA ainda não carregou; use modo mira.')};$('mirrorBtn').onclick=()=>{mirror=!mirror;video.classList.toggle('mirror',mirror);$('mirrorBtn').classList.toggle('active',mirror)};$('aimBtn').onclick=()=>{showAim=!showAim;aim.classList.toggle('off',!showAim);cross.classList.toggle('off',!showAim);$('aimBtn').classList.toggle('active',showAim)};$('camBtn').onclick=async()=>{cameraFacing=cameraFacing==='environment'?'user':'environment';mirror=cameraFacing==='user';video.classList.toggle('mirror',mirror);await openCamera()};$('freezeBtn').onclick=()=>{frozen=!frozen;$('freezeBtn').classList.toggle('active',frozen);$('freezeBtn').textContent=frozen?'Retomar':'Congelar'};$('leftBtn').onclick=()=>{$('rotFine').value=+v('rotFine')-5;updateLabels();updateAimCss();if(calibrated)applyTarget(mode==='ai'&&lastFoot?targetFromFoot(lastFoot):targetFromAim(),true)};$('rightBtn').onclick=()=>{$('rotFine').value=+v('rotFine')+5;updateLabels();updateAimCss();if(calibrated)applyTarget(mode==='ai'&&lastFoot?targetFromFoot(lastFoot):targetFromAim(),true)};['aimSize','cover','yFine','xFine','rotFine','opacity','pitch','smooth'].forEach(id=>$(id).oninput=()=>{updateLabels();updateAimCss();if(calibrated)applyTarget(mode==='ai'&&lastFoot?targetFromFoot(lastFoot):targetFromAim(),false)});
updateLabels();initThree();resize();setState('Pronto para abrir câmera');
</script>
