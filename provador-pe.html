<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Corre 4 • Provador Mobile por Mira</title>
<meta name="theme-color" content="#050915" />
<style>
:root{--bg:#050915;--glass:rgba(5,10,20,.76);--glass2:rgba(8,16,30,.90);--line:rgba(255,255,255,.14);--text:#f4f8ff;--muted:#b6c6dc;--gold:#f5c83b;--green:#18c77b;--blue:#3298ff;--red:#ff4a66}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050915;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button{font-family:inherit}
#stage{position:fixed;inset:0;overflow:hidden;background:#050915}video,#shoeCanvas,#debugCanvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}video{z-index:1;background:#10131d}#shoeCanvas{z-index:3;pointer-events:none}#debugCanvas{z-index:4;pointer-events:none}.shade{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% 52%,transparent 0 32%,rgba(0,0,0,.06) 68%,rgba(0,0,0,.22) 100%)}
.top{position:absolute;z-index:12;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}.brand{pointer-events:auto;max-width:52vw;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);border-radius:16px;padding:9px 11px;box-shadow:0 12px 32px rgba(0,0,0,.28)}.brand h1{font-size:14px;line-height:1.05;margin:0 0 3px;font-weight:950}.brand p{font-size:11px;line-height:1.22;margin:0;color:var(--muted);font-weight:750}.topBtns{display:flex;gap:6px;pointer-events:auto}.topBtns button,.miniBtn{border:1px solid var(--line);background:var(--glass);color:var(--text);border-radius:12px;min-height:34px;padding:0 10px;font-size:11px;font-weight:950}.topBtns .gold{border:0;background:linear-gradient(#ffdc55,#d6aa1d);color:#171100}.topBtns .blue{background:#123052}
.aim{position:absolute;z-index:5;left:50%;top:50%;width:min(76vw,430px);height:min(47vh,390px);transform:translate(-50%,-50%) rotate(var(--aim-rot,0deg));pointer-events:none;transition:.18s ease}.aim.hidden{display:none}.aim::before{content:"";position:absolute;inset:0;border:3px dashed rgba(245,200,59,.86);border-radius:52% 52% 46% 46%;box-shadow:0 0 0 9999px rgba(0,0,0,.03),0 0 42px rgba(245,200,59,.12)}.aim.locked::before{border-color:rgba(24,199,123,.92);box-shadow:0 0 42px rgba(24,199,123,.2)}.aim .toe{position:absolute;left:50%;top:-15px;transform:translateX(-50%);background:rgba(245,200,59,.96);color:#181200;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:950;white-space:nowrap}.aim .heel{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);background:rgba(5,10,20,.84);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 10px;font-size:10px;font-weight:900;color:#dce8fb;white-space:nowrap}.aim .centerLine{position:absolute;left:50%;top:4%;bottom:4%;width:2px;background:linear-gradient(transparent,rgba(255,255,255,.8),transparent);transform:translateX(-50%)}.aim .cross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.9);border-radius:50%;background:rgba(24,199,123,.15)}
.guide{position:absolute;z-index:9;left:50%;top:calc(50% + min(26vh,225px));transform:translateX(-50%);width:min(90vw,510px);pointer-events:none;text-align:center}.guide .msg{display:inline-block;background:rgba(5,10,20,.82);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:950;text-shadow:0 2px 10px #000}.points{margin-top:6px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}.chip{background:rgba(5,10,20,.78);border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:5px 7px;font-size:9px;font-weight:950;color:#d4e3f6}.chip.ok{background:rgba(24,199,123,.23);border-color:rgba(24,199,123,.8);color:#dfffee}.chip.bad{background:rgba(255,74,102,.18);border-color:rgba(255,74,102,.42);color:#ffe1e6}
.bottom{position:absolute;z-index:20;left:max(7px,env(safe-area-inset-left));right:max(7px,env(safe-area-inset-right));bottom:max(7px,env(safe-area-inset-bottom));display:grid;gap:6px;pointer-events:none}.primaryBar{pointer-events:auto;background:rgba(5,10,20,.84);border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:7px;display:grid;grid-template-columns:1.28fr 1.1fr .82fr .82fr;gap:5px;backdrop-filter:blur(16px)}.primaryBar button{border:0;border-radius:13px;min-height:40px;color:#fff;font-weight:950;font-size:11px;padding:0 6px}.primaryBar .start{background:linear-gradient(#19d98a,#0d9d5f)}.primaryBar .cal{background:linear-gradient(#ffdd55,#d5aa1e);color:#171100}.primaryBar .photo{background:linear-gradient(#43a9ff,#146dc7)}.primaryBar .settings{background:#172942}.quickBar{pointer-events:auto;background:rgba(5,10,20,.70);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:6px;display:flex;gap:5px;overflow-x:auto;backdrop-filter:blur(14px);scrollbar-width:none}.quickBar::-webkit-scrollbar{display:none}.quickBar button{border:0;border-radius:12px;min-height:31px;padding:0 11px;font-size:10px;font-weight:950;color:#edf5ff;background:rgba(255,255,255,.12);white-space:nowrap}.quickBar button.active{background:linear-gradient(#ffdd55,#d5aa1e);color:#171100}.drawer{pointer-events:auto;display:none;background:rgba(5,10,20,.91);border:1px solid var(--line);border-radius:18px;padding:9px;grid-template-columns:1fr 1fr;gap:8px;backdrop-filter:blur(18px);max-height:45vh;overflow:auto}.drawer.open{display:grid}.ctl{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:9px}.ctl label{display:flex;justify-content:space-between;gap:7px;margin-bottom:5px;color:#cbd8ea;font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:950}.ctl input{width:100%;accent-color:var(--gold)}
.toast{display:none;position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);max-width:86vw;text-align:center;background:rgba(5,10,20,.94);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:15px 17px;font-size:14px;line-height:1.36;font-weight:850;box-shadow:0 20px 60px rgba(0,0,0,.45)}.toast.show{display:block}.debugBox{display:none;position:absolute;z-index:18;right:8px;top:70px;width:min(92vw,360px);max-height:50vh;overflow:auto;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:9px;font:11px/1.38 ui-monospace,Consolas,monospace;white-space:pre-wrap}.debugBox.show{display:block}
@media(max-width:440px){.brand{max-width:42vw;padding:7px 8px;border-radius:14px}.brand h1{font-size:11px}.brand p{font-size:9px}.topBtns button{min-height:30px;padding:0 7px;font-size:10px}.aim{width:78vw;height:39vh;top:48%}.aim .toe{font-size:10px;top:-12px;padding:5px 9px}.aim .heel{font-size:9px;bottom:-12px}.guide{top:calc(48% + 22vh)}.guide .msg{font-size:10px;padding:6px 9px}.chip{font-size:8px;padding:4px 6px}.primaryBar{grid-template-columns:1.15fr 1fr .78fr .82fr;border-radius:15px;padding:5px}.primaryBar button{min-height:35px;border-radius:11px;font-size:10px}.quickBar{padding:5px}.quickBar button{min-height:29px;font-size:9px;padding:0 9px}.drawer{gap:6px;padding:7px}.ctl{padding:7px}.ctl label{font-size:8px}.toast{font-size:12px}}
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video><div class="shade"></div><canvas id="shoeCanvas"></canvas><canvas id="debugCanvas"></canvas>
  <div class="top"><div class="brand"><h1>Corre 4 • Mira Mobile</h1><p id="statusText">Abra a câmera e calibre pela mira</p></div><div class="topBtns"><button id="homeBtn">Início</button><button class="blue" id="debugBtn">Pontos</button><button class="gold" id="resetBtn">Reset</button></div></div>
  <div class="aim" id="aim"><div class="toe">PONTA DO PÉ</div><div class="centerLine"></div><div class="cross"></div><div class="heel">CALCANHAR</div></div>
  <div class="guide"><div class="msg" id="guideMsg">Coloque o pé dentro da mira e toque em “Calibrar pela mira”</div><div class="points"><span class="chip bad" id="chipMode">MIRA</span><span class="chip bad" id="chipToe">PONTA</span><span class="chip bad" id="chipHeel">CALCANHAR</span><span class="chip bad" id="chipAnkle">TORNOZELO</span><span class="chip bad" id="chipFollow">SEGUIR</span></div></div>
  <div class="bottom"><div class="primaryBar"><button class="start" id="cameraBtn">Abrir câmera</button><button class="cal" id="calibrateBtn">Calibrar pela mira</button><button class="photo" id="photoBtn">Foto</button><button class="settings" id="settingsBtn">Ajustes</button></div><div class="quickBar"><button class="active" id="miraModeBtn">Modo mira</button><button id="followBtn">Seguir IA</button><button id="aimBtn" class="active">Mira</button><button id="mirrorBtn">Espelhar</button><button id="camBtn">Trocar câmera</button><button id="rotLeftBtn">↶</button><button id="rotRightBtn">↷</button></div><div class="drawer" id="drawer"><div class="ctl"><label>Cobertura <span id="vCover">112%</span></label><input id="cover" type="range" min="80" max="155" value="112"></div><div class="ctl"><label>Tamanho mira <span id="vAim">100%</span></label><input id="aimSize" type="range" min="70" max="130" value="100"></div><div class="ctl"><label>Altura <span id="vY">0</span></label><input id="offY" type="range" min="-180" max="180" value="0"></div><div class="ctl"><label>Lateral <span id="vX">0</span></label><input id="offX" type="range" min="-180" max="180" value="0"></div><div class="ctl"><label>Rotação <span id="vRot">0°</span></label><input id="rot" type="range" min="-180" max="180" value="0"></div><div class="ctl"><label>Opacidade <span id="vOp">96%</span></label><input id="opacity" type="range" min="45" max="100" value="96"></div><div class="ctl"><label>Suavização <span id="vSmooth">72%</span></label><input id="smooth" type="range" min="5" max="95" value="72"></div><div class="ctl"><label>Pitch visual <span id="vPitch">0°</span></label><input id="pitch" type="range" min="-80" max="80" value="0"></div></div></div>
  <div class="toast" id="toast"></div><div class="debugBox" id="debugBox"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script type="module">
import { FilesetResolver, PoseLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $=id=>document.getElementById(id);const video=$('video'),canvas=$('shoeCanvas'),debugCanvas=$('debugCanvas'),dbg=debugCanvas.getContext('2d');
const statusText=$('statusText'),guideMsg=$('guideMsg'),aim=$('aim'),toast=$('toast'),debugBox=$('debugBox');
const chip={mode:$('chipMode'),toe:$('chipToe'),heel:$('chipHeel'),ankle:$('chipAnkle'),follow:$('chipFollow')};
let cameraMode='environment',mirror=false,showAim=true,debug=false,pose=null,lastVideoTime=-1,tracking=false,calibrated=false,followAI=false;
let renderer,scene,camera,loader,shoeRoot=null,modelLength=1,smoothPose=null,lastFoot=null,raf=0;
const cfg={cover:1.12,aimScale:1,offX:0,offY:0,rot:0,opacity:.96,smooth:.72,pitch:0,aimRot:0};
function msg(t){statusText.textContent=t}function guide(t){guideMsg.textContent=t}function showToast(t,ms=1800){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),ms)}function ok(el,v){el.classList.toggle('ok',!!v);el.classList.toggle('bad',!v)}
function resize(){const w=innerWidth,h=innerHeight;canvas.width=w;canvas.height=h;debugCanvas.width=w;debugCanvas.height=h;if(renderer){renderer.setSize(w,h,false);camera.left=-w/2;camera.right=w/2;camera.top=h/2;camera.bottom=-h/2;camera.updateProjectionMatrix()}applyAimSize()}addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));
async function openCamera(){try{if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:cameraMode},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();resize();msg('Câmera pronta • coloque o pé na mira');guide('Coloque o pé dentro da mira e toque em “Calibrar pela mira”');showToast('Câmera aberta');return true}catch(e){try{const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:true});video.srcObject=stream;await video.play();resize();msg('Câmera aberta em modo compatível');return true}catch(err){showToast('Não abriu a câmera. Use HTTPS e permita a câmera.');msg('Erro ao abrir câmera');return false}}}
async function loadPose(){if(pose)return pose;msg('Carregando IA para seguir o pé...');const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');const models=[['full','GPU','https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task'],['full','CPU','https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task'],['lite','GPU','https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task'],['lite','CPU','https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task']];let last;for(const [n,d,p] of models){try{pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:p,delegate:d},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:.22,minPosePresenceConfidence:.22,minTrackingConfidence:.22});msg(`IA carregada (${n}/${d})`);return pose}catch(e){last=e}}throw last}
function initThree(){renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;scene=new THREE.Scene();camera=new THREE.OrthographicCamera(-innerWidth/2,innerWidth/2,innerHeight/2,-innerHeight/2,-2000,2000);camera.position.z=1000;scene.add(new THREE.AmbientLight(0xffffff,1.35));let l=new THREE.DirectionalLight(0xffffff,1.55);l.position.set(0,0,900);scene.add(l);loader=new THREE.GLTFLoader();loader.load('models/corre4.glb',g=>{shoeRoot=g.scene;prep(shoeRoot);scene.add(shoeRoot);shoeRoot.visible=false;msg('Modelo carregado • pronto para calibrar')},undefined,()=>{shoeRoot=fallback();scene.add(shoeRoot);shoeRoot.visible=false;msg('Modelo básico carregado')})}
function prep(root){const box=new THREE.Box3().setFromObject(root),s=new THREE.Vector3(),c=new THREE.Vector3();box.getSize(s);box.getCenter(c);root.position.sub(c);modelLength=Math.max(s.x,s.y,s.z,.001);root.traverse(o=>{if(o.isMesh&&o.material){o.material.transparent=true;o.material.opacity=cfg.opacity;o.frustumCulled=false}})}
function fallback(){const g=new THREE.Group(),red=new THREE.MeshStandardMaterial({color:0xd20a22,roughness:.75,transparent:true,opacity:cfg.opacity}),dark=new THREE.MeshStandardMaterial({color:0x4b050b,roughness:.85,transparent:true,opacity:cfg.opacity}),white=new THREE.MeshBasicMaterial({color:0xffffff});const sole=new THREE.Mesh(new THREE.BoxGeometry(300,38,86),dark);sole.position.y=-26;g.add(sole);const upper=new THREE.Mesh(new THREE.BoxGeometry(265,70,72),red);upper.position.y=8;g.add(upper);for(let i=0;i<5;i++){let lace=new THREE.Mesh(new THREE.BoxGeometry(65,6,5),dark);lace.position.set(-35+i*18,48,30);lace.rotation.z=(i%2?.22:-.22);g.add(lace)}const t=txt('CORRE');t.position.set(-25,16,43);g.add(t);modelLength=300;return g}function txt(t){const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.font='900 82px Arial';x.fillStyle='#fff';x.fillText(t,20,92);return new THREE.Mesh(new THREE.PlaneGeometry(140,35),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true}))}
function aimRect(){const r=aim.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height,angle:(cfg.aimRot-90)*Math.PI/180}}
function world(pt){return{x:pt.x-innerWidth/2,y:-(pt.y-innerHeight/2)}}
function calibrateByAim(){if(!shoeRoot){showToast('Modelo ainda carregando');return}const r=aimRect();calibrated=true;tracking=true;followAI=false;smoothPose={x:r.x,y:r.y,angle:r.angle,len:r.h*cfg.cover};shoeRoot.visible=true;aim.classList.add('locked');ok(chip.mode,true);ok(chip.follow,false);applyShoe(smoothPose,true);guide('Tênis calçado pela mira. Use “Seguir IA” só se os pontos aparecerem.');msg('Calibrado pela mira • tamanho fixo');showToast('Calibrado pela mira')}
function lmToScreen(lm){const sw=innerWidth,sh=innerHeight,vw=video.videoWidth||sw,vh=video.videoHeight||sh,va=vw/vh,sa=sw/sh;let dw,dh,cx=0,cy=0;if(sa>va){dw=sw;dh=sw/va;cy=(dh-sh)/2}else{dh=sh;dw=sh*va;cx=(dw-sw)/2}let x=lm.x*dw-cx;if(mirror)x=sw-x;return{x,y:lm.y*dh-cy,z:lm.z||0,ok:(lm.visibility??1)>.22,vis:lm.visibility??1}}
function getFoot(lms){const sides={left:[27,29,31],right:[28,30,32]};const get=s=>{const a=lmToScreen(lms[sides[s][0]]),h=lmToScreen(lms[sides[s][1]]),t=lmToScreen(lms[sides[s][2]]);const len=Math.hypot(t.x-h.x,t.y-h.y);return{side:s,ankle:a,heel:h,toe:t,len,valid:a.ok&&h.ok&&t.ok&&len>35,score:(a.vis+h.vis+t.vis)/3}};const L=get('left'),R=get('right');return R.valid&&R.score>=L.score?R:L.valid?L:(R.score>L.score?R:L)}
function metric(f){const vx=f.toe.x-f.heel.x,vy=f.toe.y-f.heel.y,len=Math.hypot(vx,vy);return{center:{x:f.heel.x+vx*.56,y:f.heel.y+vy*.56},angle:Math.atan2(-vy,vx),len,valid:f.valid&&len>35&&len<innerHeight*.85,foot:f}}
function applyShoe(m,force=false){if(!shoeRoot||!m)return;const s=force?0:cfg.smooth;if(!smoothPose||force)smoothPose={...m};smoothPose.x=smoothPose.x*s+m.center.x*(1-s);smoothPose.y=smoothPose.y*s+m.center.y*(1-s);const da=Math.atan2(Math.sin(m.angle-smoothPose.angle),Math.cos(m.angle-smoothPose.angle));smoothPose.angle+=da*(1-s);const p=world({x:smoothPose.x,y:smoothPose.y});const angle=smoothPose.angle+cfg.rot;const side=angle+Math.PI/2;shoeRoot.position.set(p.x+Math.cos(side)*cfg.offX,p.y+Math.sin(side)*cfg.offX+cfg.offY,0);const scale=(smoothPose.len/(modelLength||300))*cfg.cover;shoeRoot.scale.set(scale,scale,scale);shoeRoot.rotation.set(THREE.Math.degToRad(cfg.pitch),0,angle);shoeRoot.traverse(o=>{if(o.isMesh&&o.material){o.material.opacity=cfg.opacity;o.material.transparent=cfg.opacity<.999}})}
function drawFoot(f,m){dbg.clearRect(0,0,innerWidth,innerHeight);if(!f)return;const pts=[['PONTA',f.toe,'#f5c83b'],['CALCANHAR',f.heel,'#18c77b'],['TORNOZELO',f.ankle,'#3298ff']];dbg.lineWidth=4;dbg.strokeStyle='rgba(255,255,255,.9)';dbg.beginPath();dbg.moveTo(f.heel.x,f.heel.y);dbg.lineTo(f.toe.x,f.toe.y);dbg.moveTo(f.heel.x,f.heel.y);dbg.lineTo(f.ankle.x,f.ankle.y);dbg.stroke();for(const [label,p,col] of pts){dbg.beginPath();dbg.fillStyle=col;dbg.strokeStyle='#fff';dbg.lineWidth=2;dbg.arc(p.x,p.y,p.ok?8:5,0,Math.PI*2);dbg.fill();dbg.stroke();dbg.fillStyle='rgba(0,0,0,.75)';dbg.font='800 11px Arial';dbg.fillText(label,p.x+10,p.y-8)}if(m&&m.valid){dbg.strokeStyle='rgba(24,199,123,.95)';dbg.lineWidth=2;dbg.beginPath();dbg.ellipse(m.center.x,m.center.y,m.len*.58,m.len*.3,-m.angle,0,Math.PI*2);dbg.stroke()}if(debug)debugBox.textContent=`calibrated=${calibrated}\ntracking=${tracking}\nfollowAI=${followAI}\nfoot=${f.side}\nvalid=${f.valid}\nlen=${m?m.len.toFixed(1):'-'}\naimScale=${cfg.aimScale}\ncover=${cfg.cover}\nmodelLength=${modelLength.toFixed(2)}`}
async function enableFollow(){if(!calibrated){showToast('Calibre pela mira primeiro');return}try{await loadPose();followAI=!followAI;ok(chip.follow,followAI);$('followBtn').classList.toggle('active',followAI);guide(followAI?'Seguindo por IA quando captar os pontos. Se perder, mantém a mira.':'Modo mira fixo: o tênis fica calibrado na mira.');msg(followAI?'IA seguindo pé quando possível':'Modo mira ativo')}catch(e){showToast('IA não carregou. Modo mira continua funcionando.')}}
async function loop(){raf=requestAnimationFrame(loop);if(renderer)renderer.render(scene,camera);if(!pose||!video.videoWidth||video.currentTime===lastVideoTime)return;lastVideoTime=video.currentTime;let res;try{res=pose.detectForVideo(video,performance.now())}catch(e){return}const lms=res.landmarks&&res.landmarks[0];if(!lms){ok(chip.toe,false);ok(chip.heel,false);ok(chip.ankle,false);return}const f=getFoot(lms),m=metric(f);lastFoot={f,m};ok(chip.toe,f.toe.ok);ok(chip.heel,f.heel.ok);ok(chip.ankle,f.ankle.ok);drawFoot(f,m);if(followAI&&tracking&&m.valid){applyShoe(m,false);msg(`Seguindo ${f.side==='left'?'pé esquerdo':'pé direito'} • tamanho fixo`)}}
function applyAimSize(){aim.style.width=`min(${76*cfg.aimScale}vw,${430*cfg.aimScale}px)`;aim.style.height=`min(${47*cfg.aimScale}vh,${390*cfg.aimScale}px)`;aim.style.setProperty('--aim-rot',cfg.aimRot+'deg')}
function bind(){
$('cameraBtn').onclick=openCamera;$('calibrateBtn').onclick=calibrateByAim;$('photoBtn').onclick=()=>{const out=document.createElement('canvas');out.width=innerWidth;out.height=innerHeight;const c=out.getContext('2d');c.drawImage(video,0,0,innerWidth,innerHeight);c.drawImage(canvas,0,0);c.drawImage(debugCanvas,0,0);const a=document.createElement('a');a.download='provador-corre4-mira.png';a.href=out.toDataURL('image/png');a.click()};
$('settingsBtn').onclick=()=>$('drawer').classList.toggle('open');$('homeBtn').onclick=()=>location.href='index.html';$('debugBtn').onclick=()=>{debug=!debug;debugBox.classList.toggle('show',debug);debugCanvas.style.display=debug?'block':'block'};$('resetBtn').onclick=()=>{calibrated=false;tracking=false;followAI=false;smoothPose=null;if(shoeRoot)shoeRoot.visible=false;aim.classList.remove('locked');ok(chip.mode,false);ok(chip.follow,false);guide('Coloque o pé dentro da mira e toque em “Calibrar pela mira”');msg('Resetado')};
$('followBtn').onclick=enableFollow;$('miraModeBtn').onclick=e=>{followAI=false;ok(chip.follow,false);$('followBtn').classList.remove('active');e.target.classList.add('active');guide('Modo mira: o tênis fica no tamanho e posição da mira.')};$('aimBtn').onclick=e=>{showAim=!showAim;aim.classList.toggle('hidden',!showAim);e.target.classList.toggle('active',showAim)};$('mirrorBtn').onclick=e=>{mirror=!mirror;video.style.transform=mirror?'scaleX(-1)':'none';e.target.classList.toggle('active',mirror)};$('camBtn').onclick=async()=>{cameraMode=cameraMode==='environment'?'user':'environment';await openCamera()};$('rotLeftBtn').onclick=()=>{cfg.aimRot-=10;applyAimSize();if(calibrated)calibrateByAim()};$('rotRightBtn').onclick=()=>{cfg.aimRot+=10;applyAimSize();if(calibrated)calibrateByAim()};
const m=[['cover','vCover',v=>{cfg.cover=v/100;return v+'%'}],['aimSize','vAim',v=>{cfg.aimScale=v/100;applyAimSize();return v+'%'}],['offY','vY',v=>{cfg.offY=+v;return v}],['offX','vX',v=>{cfg.offX=+v;return v}],['rot','vRot',v=>{cfg.rot=THREE.Math.degToRad(+v);return v+'°'}],['opacity','vOp',v=>{cfg.opacity=v/100;return v+'%'}],['smooth','vSmooth',v=>{cfg.smooth=v/100;return v+'%'}],['pitch','vPitch',v=>{cfg.pitch=+v;return v+'°'}]];for(const [id,out,fn] of m){$(id).oninput=e=>{ $(out).textContent=fn(e.target.value); if(id==='aimSize'&&calibrated)calibrateByAim(); if(calibrated&&smoothPose)applyShoe({center:smoothPose,angle:smoothPose.angle,len:smoothPose.len,valid:true},true)};$(out).textContent=fn($(id).value)}
}
bind();initThree();resize();openCamera();loop();
</script>
</body>
